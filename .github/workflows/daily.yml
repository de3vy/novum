name: novum-daily

on:
  schedule:
    - cron: "0 12 * * *"      # runs daily even without Manus (12:00 UTC)
  workflow_dispatch:          # Manus triggers this manually each morning

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install sympy networkx z3-solver requests
      - name: Generate candidates
        run: python candidates/gen.py > results/candidates.json
      - name: Test & verify
        run: python pipeline/test.py results/candidates.json > results/results.json
        env:
          PYTHONPATH: .
      - name: Check novelty (OEIS)
        run: python pipeline/novelty.py results/results.json
      - name: Commit results
        run: |
          git config user.name "novum-bot"
          git config user.email "bot@novum.dev"
          git add results/
          git commit -m "daily results $(date +%F)" || true
          git push
